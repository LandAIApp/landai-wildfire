# Publishes the React frontend to GitHub Pages.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   VITE_API_BASE_URL        public URL of the deployed backend (e.g. the Cloud Run URL)
#   VITE_LANDAI_CONTACT_URL  (optional) destination of the "Talk to Land AI" link
name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LANDAI_CONTACT_URL: ${{ vars.VITE_LANDAI_CONTACT_URL }}
          # Project sites live under /<repo-name>/ ; remove this line if you use a custom domain.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # SPA fallback so deep links do not 404 on Pages
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
