<text x="1100" y="206" class="s">Sentinel-2 · VIIRS · límites administrativos</text>
<text x="1100" y="232" class="s">· Entrena y clasifica la quema (motor V7.6)</text>
<text x="1100" y="254" class="s">· Entrega el raster de quema (GeoTIFF) para</text>
<text x="1100" y="274" class="s">  la huella afectada a 20 m, por mosaicos</text>
<text x="1100" y="304" class="s">Cuenta de servicio · cuota de EE</text>
<rect class="ext" x="1082" y="358" width="356" height="128" rx="12"/>
<text x="1100" y="386" class="t">OpenStreetMap · Overpass API</text>
<text x="1100" y="410" class="s">Edificios, vías, salud, educación</text>
<text x="1100" y="432" class="s">Consultas por celdas, espejos de respaldo,</text>
<text x="1100" y="452" class="s">espera ante 429 · © colaboradores OSM (ODbL)</text>
<rect class="ext" x="1082" y="504" width="356" height="128" rx="12"/>
<text x="1100" y="532" class="t">WorldPop API v2</text>
<text x="1100" y="556" class="s">Población en malla de 100 m (año 2020)</text>
<text x="1100" y="578" class="s">Tarea asíncrona sobre la huella afectada</text>
<text x="1100" y="598" class="s">CC BY 4.0 · estimación, no censo</text>

<!-- ARROWS -->
<path class="l" d="M418 198 H562" marker-end="url(#a)"/><text x="446" y="188" class="c">HTTPS · JSON</text>
<path class="l" d="M562 420 H418" marker-end="url(#a)"/><text x="450" y="440" class="c">Resultados</text>
<path class="l" d="M938 298 H1082" marker-end="url(#a)"/><text x="962" y="288" class="c">Análisis</text>
<path class="l" d="M938 400 H1082" marker-end="url(#a)"/><text x="976" y="390" class="c">OSM</text>
<path class="l" d="M938 540 H1082" marker-end="url(#a)"/><text x="958" y="530" class="c">Población</text>

<!-- BOTTOM -->
<rect class="zone" x="40" y="712" width="1420" height="110" rx="16"/>
<text x="62" y="742" class="z">DESPLIEGUE Y COSTO</text>
<text x="62" y="772" class="s">Frontend estático en GitHub Pages (gratis) · Backend en Cloud Run (pago por uso, escala a cero, máx. 3 instancias)</text>
<text x="62" y="796" class="s">Sin base de datos ni servicios de pago adicionales · límites por IP · modo demo solo con resultados reales grabados</text>
<rect class="new" x="1150" y="738" width="22" height="16" rx="4"/><text x="1182" y="751" class="s">Nuevo en v2</text>
<rect class="box" x="1150" y="768" width="22" height="16" rx="4"/><text x="1182" y="781" class="s">Sin cambios</text>
<rect class="ext" x="1310" y="738" width="22" height="16" rx="4"/><text x="1342" y="751" class="s">Externo</text>
